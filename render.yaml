###############################################################################
# render.yaml — Render Deployment Configuration
# Docs: https://render.com/docs/blueprint-spec
###############################################################################

services:
  - type: web
    name: videodl-backend
    runtime: python
    region: singapore          # closest to SEA users; change if needed
    plan: free                 # free | starter | standard …

    # ── Source ─────────────────────────────────────────────────────────
    rootDir: backend           # only the backend/ folder is deployed

    # ── Build ──────────────────────────────────────────────────────────
    # 1. Install FFmpeg from apt (available on Render Ubuntu base image)
    # 2. Install Python dependencies
    buildCommand: |
      apt-get update -qq && apt-get install -y -qq ffmpeg
      pip install --upgrade pip
      pip install -r requirements.txt

    # ── Start ──────────────────────────────────────────────────────────
    startCommand: gunicorn -c gunicorn.conf.py app:app

    # ── Health check ───────────────────────────────────────────────────
    healthCheckPath: /health

    # ── Environment variables ──────────────────────────────────────────
    # ⚠  Set SECRET_KEY and ALLOWED_ORIGINS in Render Dashboard, not here.
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"

      - key: FFMPEG_PATH
        value: /usr/bin/ffmpeg

      - key: TMP_DIR
        value: /tmp/videodl

      - key: MAX_VIDEO_SECONDS
        value: "3600"           # 1 hour max video duration

      - key: MAX_FILE_MB
        value: "500"            # 500 MB max file size

      # ── Set these in Render Dashboard (sensitive) ──────────────────
      # SECRET_KEY     → random string, e.g. openssl rand -hex 32
      # ALLOWED_ORIGINS → https://your-app.vercel.app
